name: Update prices

# Nightly price feed for the Shopping App.
# Runs at 03:00 AWST (19:00 UTC) + manually via "Run workflow".
# NOTE: GitHub disables scheduled workflows after 60 days with no repo
# activity — use the manual dispatch button or push any commit to keep it alive.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        run: node scrape.js
        env:
          COLES_COOKIE: ${{ secrets.COLES_COOKIE }}
          WOOL_COOKIE: ${{ secrets.WOOL_COOKIE }}

      - name: Commit & push price feed
        run: |
          git config user.name "price-feed[bot]"
          git config user.email "price-feed[bot]@users.noreply.github.com"
          git add pwa/data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "chore: refresh price feed"
            git push
          fi
